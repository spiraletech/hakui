name: HAKUI L8 Spiral Presence

on:
  push:
    branches:
      - trinity/hakui-l8-spiral-presence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: trinity/hakui-l8-spiral-presence
          fetch-depth: 0

      - name: Apply L8 integration
        run: python tools/apply_l8_spiral_presence.py

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "L8 integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/world/BlackRoom.cpp src/render/DebugWorldRenderer.hpp src/render/DebugWorldRenderer.cpp src/core/HakuiApp.hpp src/core/HakuiApp.cpp
          git commit -m "L8 — integrate visible SpiralPresence into HAKUI"
          git push origin HEAD:trinity/hakui-l8-spiral-presence
